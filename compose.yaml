name: gaokao-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: gaokao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GAOKAO_DB_NAME:-gaokao}
      POSTGRES_USER: ${GAOKAO_DB_USERNAME:-gaokao}
      POSTGRES_PASSWORD: ${GAOKAO_DB_PASSWORD:-gaokao_dev_password}
    ports:
      - "127.0.0.1:${GAOKAO_DB_PORT:-15432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAOKAO_DB_USERNAME:-gaokao} -d ${GAOKAO_DB_NAME:-gaokao}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
