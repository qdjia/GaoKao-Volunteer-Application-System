server:
  port: 8080

spring:
  datasource:
    url: ${GAOKAO_DB_URL:jdbc:postgresql://localhost:15432/gaokao}
    driver-class-name: org.postgresql.Driver
    username: ${GAOKAO_DB_USERNAME:gaokao}
    password: ${GAOKAO_DB_PASSWORD:gaokao_dev_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gaokao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gaokao: info
    org.mybatis: warn

gaokao:
  demo-data:
    enabled: ${GAOKAO_DEMO_DATA_ENABLED:false}
  application-window:
    start: 2026-01-01T00:00:00
    end: 2026-12-31T23:59:59
    zone-id: Asia/Shanghai
