server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/gaokao;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:db/schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gaokao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gaokao: info
    org.mybatis: warn

gaokao:
  demo-data:
    enabled: true
  application-window:
    start: 2026-01-01T00:00:00
    end: 2026-12-31T23:59:59
    zone-id: Asia/Shanghai
