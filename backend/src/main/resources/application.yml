server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${GAOKAO_DB_URL:jdbc:postgresql://localhost:15432/gaokao}
    driver-class-name: org.postgresql.Driver
    username: ${GAOKAO_DB_USERNAME:gaokao}
    password: ${GAOKAO_DB_PASSWORD:gaokao_dev_password}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gaokao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gaokao: info
    org.mybatis: warn

gaokao:
  workflow:
    mode: ${GAOKAO_APP_MODE:PRODUCTION}
    notice-version: ${GAOKAO_NOTICE_VERSION:2026-1}
  security:
    jwt-secret: ${GAOKAO_JWT_SECRET:}
    proxy-secret: ${GAOKAO_PROXY_SECRET:}
    session-duration: 2h
    max-login-attempts: 5
    lock-duration: 15m
    allowed-origins: ${GAOKAO_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    admin-username: ${GAOKAO_ADMIN_USERNAME:}
    admin-password: ${GAOKAO_ADMIN_PASSWORD:}
  demo-data:
    enabled: ${GAOKAO_DEMO_DATA_ENABLED:false}
  application-window:
    start: 2026-01-01T00:00:00
    end: 2026-12-31T23:59:59
    zone-id: Asia/Shanghai
