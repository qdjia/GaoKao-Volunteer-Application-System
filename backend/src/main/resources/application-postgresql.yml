server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gaokao
    driver-class-name: org.postgresql.Driver
    username: ${GAOKAO_DB_USERNAME:postgres}
    password: ${GAOKAO_DB_PASSWORD:postgres}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gaokao.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.gaokao: info
    org.mybatis: warn

gaokao:
  demo-data:
    enabled: false
  application-window:
    start: ${GAOKAO_APPLICATION_START:2026-01-01T00:00:00}
    end: ${GAOKAO_APPLICATION_END:2026-12-31T23:59:59}
    zone-id: ${GAOKAO_APPLICATION_ZONE:Asia/Shanghai}
